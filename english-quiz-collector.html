<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Quiz</title>
<style>
  :root{
    --bg:#EDF0E9; --surface:#FFFFFF; --ink:#22271F; --primary:#2E3A1C; --primary2:#41541f;
    --accent:#0B5563; --good:#1E7A46; --bad:#B0453B; --muted:#6B7A72; --line:#DBE0D2;
    --serif:Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;padding:24px 14px 60px}
  .wrap{max-width:720px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
  h1{font-family:var(--serif);font-size:34px;margin:.1em 0}
  h2{font-family:var(--serif);font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 16px}
  label.fld{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
  input[type=text],textarea{width:100%;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);
       border-radius:10px;font-family:inherit;color:var(--ink);background:#fff}
  textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .btn{border:0;border-radius:12px;background:var(--primary);color:#F6F3E7;font:600 16px var(--sans);
       padding:12px 20px;cursor:pointer} .btn:hover{background:var(--primary2)}
  .btn.sec{background:#fff;color:var(--primary);border:1.5px solid var(--line)}
  .btn.wide{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;padding:6px 4px}
  .sectionhead{font-family:var(--serif);font-size:19px;color:var(--primary);border-bottom:2px solid var(--line);padding-bottom:6px;margin:26px 0 6px}
  .qwrap{padding:14px 0;border-bottom:1px solid var(--line)}
  .qtext{font-size:16px;margin:0 0 8px} .qnum{color:var(--muted);font-weight:700;margin-right:6px}
  .qimg{max-width:100%;max-height:300px;border-radius:12px;margin:2px 0 12px;display:block;border:1px solid var(--line)}
  .ansinput{width:100%;max-width:340px;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;color:var(--ink);background:#fff;margin-top:2px}
  .ansinput:focus{outline:3px solid #b9d4c6}
  .bar{position:sticky;bottom:0;background:rgba(237,240,233,.94);backdrop-filter:blur(4px);padding:12px 0 4px}
  .progress{height:8px;background:#dfe4d6;border-radius:6px;overflow:hidden;margin-bottom:8px}
  .progress>i{display:block;height:100%;width:0;background:var(--good)}
  .count{font-size:13px;color:var(--muted);margin-bottom:8px}
  .score{font-family:var(--serif);font-size:48px;margin:4px 0}
  .codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;
       background:#f4f6f0;border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0}
  .rev{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .tag{font-weight:700;margin-right:8px}.ok{color:var(--good)}.no{color:var(--bad)}
  .pill{display:inline-block;background:#eef2e6;border-radius:8px;padding:2px 8px;margin:2px 0}
  .yourans{color:var(--bad)}.rightans{color:var(--good)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:12px}
  .note{font-size:13px;color:var(--muted);margin-top:12px}
  .hidden{display:none}
  .good-msg{color:var(--good);font-weight:600}
  .detail{background:#f8faf4;border:1px solid var(--line);border-radius:10px;padding:6px 14px;margin:6px 0}
  .detail .rev:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <section id="start" class="card">
    <h1>English Quiz</h1>
    <p class="sub">to be &amp; Greetings · A1</p>
    <label class="fld" for="name">Имя и фамилия</label>
    <input type="text" id="name" placeholder="например, Иван Петров" autocomplete="off">
    <div class="row" style="margin-top:16px">
      <button class="btn" id="startBtn">Начать тест</button>
      <button class="link" id="teacherLink">Кабинет учителя</button>
    </div>
    <p class="note" id="storeNote"></p>
  </section>

  <section id="quiz" class="hidden">
    <div class="card">
      <h2 id="quizWho">Тест</h2>
      <p class="sub">Впишите ответ в поле в каждом вопросе.</p>
      <div id="questions"></div>
    </div>
    <div class="bar">
      <div class="progress"><i id="pbar"></i></div>
      <div class="count" id="pcount"></div>
      <button class="btn wide" id="submitBtn">Проверить и отправить</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <h2 id="resHead">Результат</h2>
    <div class="score" id="scoreBig">0 / 0</div>
    <div class="sub" id="scoreMsg"></div>
    <div class="card" style="background:#f8faf4;border-color:#cfe0c8;margin:14px 0">
      <b>Отправь этот код учителю:</b>
      <div class="codebox" id="codeBox"></div>
      <div class="row"><button class="btn" id="copyBtn">Скопировать код</button><span id="copyMsg" class="good-msg"></span></div>
    </div>
    <button class="btn sec" id="toggleReview">Показать разбор</button>
    <div id="review" class="hidden" style="margin-top:12px"></div>
    <div class="row" style="margin-top:18px">
      <button class="btn" id="retryBtn">Пройти заново</button>
      <button class="btn sec" id="homeBtn">На главную</button>
    </div>
  </section>

  <section id="teacher" class="card hidden">
    <h2>Кабинет учителя</h2>
    <div id="tGate">
      <label class="fld" for="tCode">Код учителя</label>
      <div class="row">
        <input type="text" id="tCode" placeholder="код" autocomplete="off" style="max-width:220px">
        <button class="btn" id="tEnter">Войти</button>
        <button class="btn sec" id="tBackBtn2">Назад</button>
      </div>
      <p class="note" id="tErr"></p>
    </div>
    <div id="tContent" class="hidden">
      <p class="sub">Вставь коды результатов от учеников — по одному на строку.</p>
      <textarea id="codesInput" placeholder="Вставь сюда коды…"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="decodeBtn">Показать результаты</button>
        <button class="btn sec" id="csvBtn">Скачать CSV</button>
        <button class="btn sec" id="tBackBtn">Назад</button>
      </div>
      <div id="teacherBody" style="margin-top:16px"></div>
      <p class="note" id="tStoreNote"></p>
    </div>
  </section>
</div>

const questions=QUIZ.filter(x=>x.q);
const total=questions.length;
function norm(s){return String(s||"").toLowerCase().trim().replace(/[\u2019\u2018`]/g,"'").replace(/\s+/g," ").replace(/^["'\u00ab\u00bb]+/,"").replace(/["'\u00ab\u00bb.,!?;:]+$/,"");}
function loose(s){return norm(s).replace(/'/g,"");}
const acceptN=questions.map(q=>(q.accept||[]).map(norm));
const acceptL=questions.map(q=>(q.accept||[]).map(loose));
function isCorrect(i,v){return acceptN[i].indexOf(norm(v))>=0||acceptL[i].indexOf(loose(v))>=0;}
const $=id=>document.getElementById(id);
const screens=["start","quiz","result","teacher"];
function show(id){screens.forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function b64enc(str){return btoa(unescape(encodeURIComponent(str)));}
function b64dec(str){return decodeURIComponent(escape(atob(str)));}
let studentName="",lastRec=null,submitArmed=false;
const hasStore=!!(window.storage&&typeof window.storage.set==="function");
$("storeNote").textContent="\u041f\u043e\u0441\u043b\u0435 \u0442\u0435\u0441\u0442\u0430 \u0442\u044b \u043f\u043e\u043b\u0443\u0447\u0438\u0448\u044c \u043a\u043e\u0434 \u2014 \u043e\u0442\u043f\u0440\u0430\u0432\u044c \u0435\u0433\u043e \u0443\u0447\u0438\u0442\u0435\u043b\u044e.";

function buildQuiz(){
  const box=$("questions");box.innerHTML="";let n=0;
  QUIZ.forEach(item=>{
    if(item.s){const h=document.createElement("div");h.className="sectionhead";h.textContent=item.s;box.appendChild(h);return;}
    n++;const idx=n-1;
    const w=document.createElement("div");w.className="qwrap";
    w.innerHTML='<p class="qtext"><span class="qnum">'+n+'.</span>'+esc(item.q)+'</p>';
    if(item.img){var im=document.createElement("img");im.className="qimg";im.loading="lazy";im.decoding="async";im.src=item.img;im.alt="";w.appendChild(im);}
    var inp=document.createElement("input");inp.type="text";inp.className="ansinput";inp.setAttribute("data-i",idx);inp.autocomplete="off";inp.spellcheck=false;inp.placeholder="\u0442\u0432\u043e\u0439 \u043e\u0442\u0432\u0435\u0442\u2026";
    inp.addEventListener("input",prog);
    w.appendChild(inp);box.appendChild(w);
  });
}
function prog(){let d=0;for(let i=0;i<total;i++){const el=document.querySelector('.ansinput[data-i="'+i+'"]');if(el&&el.value.trim())d++;}
  $("pcount").textContent="\u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u043e "+d+" \u0438\u0437 "+total;$("pbar").style.width=(d/total*100)+"%";}
function collectAnswers(){const a=[];for(let i=0;i<total;i++){const el=document.querySelector('.ansinput[data-i="'+i+'"]');a.push(el?el.value.trim():"");}return a;}
function gradeAnswers(ans){let c=0;for(let i=0;i<total;i++)if(isCorrect(i,ans[i]))c++;return c;}
function makeCode(rec){return b64enc(JSON.stringify({v:2,n:rec.name,t:rec.ts,a:rec.ans}));}

$("startBtn").addEventListener("click",()=>{
  studentName=$("name").value.trim();
  if(!studentName){$("name").focus();$("name").style.borderColor="#B0453B";$("storeNote").style.color="#B0453B";$("storeNote").textContent="Введите имя, чтобы начать тест.";return;}
  $("quizWho").textContent="\u0422\u0435\u0441\u0442 \u2014 "+studentName;submitArmed=false;buildQuiz();prog();show("quiz");
});
$("submitBtn").addEventListener("click",()=>{
  let d=0;for(let i=0;i<total;i++){const el=document.querySelector('.ansinput[data-i="'+i+'"]');if(el&&el.value.trim())d++;}
  if(d<total&&!submitArmed){submitArmed=true;$("pcount").textContent="\u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u043e "+d+" \u0438\u0437 "+total+". \u041d\u0430\u0436\u043c\u0438 \u00ab\u041f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c\u00bb \u0435\u0449\u0451 \u0440\u0430\u0437, \u0447\u0442\u043e\u0431\u044b \u043e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c.";return;}
  submitArmed=false;
  const ans=collectAnswers();const correct=gradeAnswers(ans);const pct=Math.round(correct/total*100);
  const now=new Date();
  lastRec={name:studentName,ans:ans,correct:correct,total:total,pct:pct,ts:now.getTime(),
    date:now.toLocaleDateString("ru-RU")+" "+now.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})};
  showResult(lastRec);
  if(hasStore){try{window.storage.set("sub:"+lastRec.ts+"-"+Math.random().toString(36).slice(2,6),JSON.stringify({name:lastRec.name,correct,total,pct,date:lastRec.date,ts:lastRec.ts,a:ans}),true);}catch(e){}}
});
function showResult(rec){
  $("resHead").textContent=rec.name+", \u0442\u0432\u043e\u0439 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442:";
  $("scoreBig").textContent=rec.correct+" / "+total;
  let m=rec.pct>=90?"\u041e\u0442\u043b\u0438\u0447\u043d\u043e! \ud83c\udf89":rec.pct>=70?"\u0425\u043e\u0440\u043e\u0448\u043e!":rec.pct>=50?"\u041d\u0435\u043f\u043b\u043e\u0445\u043e, \u043f\u043e\u0432\u0442\u043e\u0440\u0438 \u0442\u0435\u043c\u0443.":"\u0414\u0430\u0432\u0430\u0439 \u043f\u043e\u0432\u0442\u043e\u0440\u0438\u043c \u0432\u043c\u0435\u0441\u0442\u0435.";
  $("scoreMsg").textContent=rec.pct+"% \u2014 "+m;
  $("codeBox").textContent=makeCode(rec);$("copyMsg").textContent="";
  const rv=$("review");rv.innerHTML="";
  rec.ans.forEach((val,i)=>{
    const ok=isCorrect(i,val);const your=val||"\u2014";
    const row=document.createElement("div");row.className="rev";
    let h='<span class="tag '+(ok?'ok':'no')+'">'+(ok?'\u2713':'\u2717')+'</span><b>'+(i+1)+'.</b> '+esc(questions[i].q)+'<br>';
    h+= ok ? '<span class="pill rightans">'+esc(your)+'</span>'
           : '\u0422\u0432\u043e\u0439 \u043e\u0442\u0432\u0435\u0442: <span class="pill yourans">'+esc(your)+'</span> \u0412\u0435\u0440\u043d\u043e: <span class="pill rightans">'+esc(questions[i].a)+'</span>';
    row.innerHTML=h;rv.appendChild(row);
  });
  show("result");
}
$("copyBtn").addEventListener("click",async()=>{
  const code=$("codeBox").textContent;
  try{await navigator.clipboard.writeText(code);$("copyMsg").textContent="\u0421\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u043e \u2713";}
  catch(e){const r=document.createRange();r.selectNodeContents($("codeBox"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("copyMsg").textContent="\u0412\u044b\u0434\u0435\u043b\u0438 \u0438 \u0441\u043a\u043e\u043f\u0438\u0440\u0443\u0439 \u0432\u0440\u0443\u0447\u043d\u0443\u044e";}
});
$("toggleReview").addEventListener("click",()=>{const h=$("review").classList.toggle("hidden");$("toggleReview").textContent=h?"\u041f\u043e\u043a\u0430\u0437\u0430\u0442\u044c \u0440\u0430\u0437\u0431\u043e\u0440":"\u0421\u043a\u0440\u044b\u0442\u044c \u0440\u0430\u0437\u0431\u043e\u0440";});
$("retryBtn").addEventListener("click",()=>{submitArmed=false;buildQuiz();prog();$("review").classList.add("hidden");$("toggleReview").textContent="\u041f\u043e\u043a\u0430\u0437\u0430\u0442\u044c \u0440\u0430\u0437\u0431\u043e\u0440";show("quiz");});
$("homeBtn").addEventListener("click",()=>{$("name").value="";show("start");});

$("teacherLink").addEventListener("click",()=>{$("tGate").classList.remove("hidden");$("tContent").classList.add("hidden");$("tCode").value="";$("tErr").textContent="";show("teacher");});
function enterTeacher(){const c=$("tCode").value.trim().toLowerCase();if(c!=="liaame"){$("tErr").textContent="\u041d\u0435\u0432\u0435\u0440\u043d\u044b\u0439 \u043a\u043e\u0434.";return;}$("tGate").classList.add("hidden");$("tContent").classList.remove("hidden");$("tStoreNote").textContent=hasStore?"\u0422\u0430\u043a\u0436\u0435 \u043f\u043e\u0434\u0433\u0440\u0443\u0436\u0435\u043d\u044b \u0430\u0432\u0442\u043e\u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d\u043d\u044b\u0435 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b (\u0435\u0441\u043b\u0438 \u0435\u0441\u0442\u044c).":"";renderTeacher();}
$("tEnter").addEventListener("click",enterTeacher);
$("tCode").addEventListener("keydown",e=>{if(e.key==="Enter")enterTeacher();});
$("tBackBtn2").addEventListener("click",()=>show("start"));

let teacherRows=[];
async function renderTeacher(){
  const codes=$("codesInput").value.split(/\s+/).map(s=>s.trim()).filter(Boolean);
  const map=new Map();
  codes.forEach(code=>{try{const o=JSON.parse(b64dec(code));if(!o||!Array.isArray(o.a))return;
    const ans=o.a;const correct=ans.reduce((s,v,i)=>s+(isCorrect(i,v)?1:0),0);const pct=Math.round(correct/total*100);
    map.set((o.t||0)+"|"+(o.n||""),{name:o.n||"\u2014",correct,total,pct,ts:o.t||0,date:o.t?new Date(o.t).toLocaleString("ru-RU"):"",ans});
  }catch(e){}});
  if(hasStore){try{const list=await window.storage.list("sub:",true);const keys=(list&&list.keys)||[];
    for(const k of keys){try{const r=await window.storage.get(k,true);if(r&&r.value){const o=JSON.parse(r.value);
      const ans=Array.isArray(o.a)?o.a:[];map.set((o.ts||0)+"|"+(o.name||""),{name:o.name||"\u2014",correct:o.correct||0,total:o.total||total,pct:o.pct||0,ts:o.ts||0,date:o.date||"",ans});}}catch(e){}}
  }catch(e){}}
  teacherRows=[...map.values()].sort((a,b)=>b.ts-a.ts);
  const body=$("teacherBody");
  if(teacherRows.length===0){body.innerHTML='<p class="sub">\u041f\u043e\u043a\u0430 \u043d\u0435\u0442 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u043e\u0432. \u0412\u0441\u0442\u0430\u0432\u044c \u043a\u043e\u0434\u044b \u0443\u0447\u0435\u043d\u0438\u043a\u043e\u0432 \u0432\u044b\u0448\u0435 \u0438 \u043d\u0430\u0436\u043c\u0438 \u00ab\u041f\u043e\u043a\u0430\u0437\u0430\u0442\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b\u00bb.</p>';return;}
  const avg=Math.round(teacherRows.reduce((s,r)=>s+r.pct,0)/teacherRows.length);
  let html='<p class="sub">\u0423\u0447\u0435\u043d\u0438\u043a\u043e\u0432: <b>'+teacherRows.length+'</b> \u00b7 \u0421\u0440\u0435\u0434\u043d\u0438\u0439 \u0431\u0430\u043b\u043b: <b>'+avg+'%</b></p>';
  html+='<table><thead><tr><th>\u0418\u043c\u044f</th><th>\u0411\u0430\u043b\u043b</th><th>%</th><th>\u041a\u043e\u0433\u0434\u0430</th><th></th></tr></thead><tbody>';
  teacherRows.forEach((r,ri)=>{
    html+='<tr><td>'+esc(r.name)+'</td><td>'+r.correct+' / '+r.total+'</td><td>'+r.pct+'%</td><td>'+esc(r.date)+'</td><td><button class="link tdetail" data-i="'+ri+'">\u043e\u0442\u0432\u0435\u0442\u044b</button></td></tr>';
    html+='<tr id="det'+ri+'" class="hidden"><td colspan="5"><div class="detail">'+answersHtml(r)+'</div></td></tr>';
  });
  html+='</tbody></table>';body.innerHTML=html;
  Array.prototype.forEach.call(body.querySelectorAll(".tdetail"),function(btn){btn.addEventListener("click",function(){const row=$("det"+btn.getAttribute("data-i"));const hid=row.classList.toggle("hidden");btn.textContent=hid?"\u043e\u0442\u0432\u0435\u0442\u044b":"\u0441\u043a\u0440\u044b\u0442\u044c";});});
}
function answersHtml(r){
  if(!r.ans||!r.ans.length) return '<p class="sub">\u041e\u0442\u0432\u0435\u0442\u044b \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u044b.</p>';
  let h='';
  r.ans.forEach(function(val,i){const ok=isCorrect(i,val);const your=val||"\u2014";
    h+='<div class="rev"><span class="tag '+(ok?'ok':'no')+'">'+(ok?'\u2713':'\u2717')+'</span><b>'+(i+1)+'.</b> '+esc(questions[i].q)+'<br>';
    h+= ok ? '<span class="pill rightans">'+esc(your)+'</span>'
           : '\u041e\u0442\u0432\u0435\u0442: <span class="pill yourans">'+esc(your)+'</span> \u0412\u0435\u0440\u043d\u043e: <span class="pill rightans">'+esc(questions[i].a)+'</span>';
    h+='</div>';});
  return h;
}
$("decodeBtn").addEventListener("click",renderTeacher);
$("tBackBtn").addEventListener("click",()=>show("start"));
$("csvBtn").addEventListener("click",()=>{
  if(!teacherRows.length){$("teacherBody").innerHTML='<p class="sub">\u0421\u043d\u0430\u0447\u0430\u043b\u0430 \u043d\u0430\u0436\u043c\u0438 \u00ab\u041f\u043e\u043a\u0430\u0437\u0430\u0442\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b\u00bb.</p>';return;}
  let header="Name,Score,Total,Percent,Date";for(let i=0;i<total;i++)header+=",Q"+(i+1);
  let csv=header+"\n";
  teacherRows.forEach(r=>{let line='"'+String(r.name).replace(/"/g,'""')+'",'+r.correct+','+r.total+','+r.pct+',"'+r.date+'"';
    for(let i=0;i<total;i++){const v=(r.ans&&r.ans[i]!=null)?r.ans[i]:"";line+=',"'+String(v).replace(/"/g,'""')+'"';}
    csv+=line+"\n";});
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="results.csv";a.click();URL.revokeObjectURL(url);
});
</script>
</body>
</html>
